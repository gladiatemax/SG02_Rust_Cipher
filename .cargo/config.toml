# Gli avvisi e i lint di thetacrypt sono disattivati nei Cargo.toml dei
# crate copiati in thetacrypt/ (tabella [lints], aggiunta da
# scripts/vendor-thetacrypt.sh), non qui: cosi' restano attivi per
# sg02-encrypt.
#
# Il rapporto di future incompatibilita' riguarda `legacy_derive_helpers` in
# theta_schemes (groups/group.rs): un costrutto che una versione futura di
# Rust rifiutera'. La toolchain e' fissata alla 1.88 in rust-toolchain.toml;
# il problema e' noto e documentato nel README, la nota a ogni build no.
[future-incompat-report]
frequency = "never"
